<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes licences</title>
<link rel="manifest" href="/admin/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root {
    --bg:#f3f4f8; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e7eb; --soft:#f1f5f9;
    --accent:#10b981; --accent-ink:#052e16; --blue:#2563eb; --red:#dc2626; --amber:#d97706; --mono:ui-monospace,Menlo,Consolas,monospace;
    --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b1220; --card:#121b2f; --text:#e5e7eb; --muted:#94a3b8; --line:#1f2a44; --soft:#172138; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:1.4 }
  body { padding-bottom:calc(var(--nav-h) + var(--safe-b)) }
  a { color:var(--blue) }
  button, input, select, textarea { font:inherit; color:inherit }
  h1 { font-size:22px; margin:0 } h2 { font-size:17px; margin:18px 0 10px } h3 { font-size:15px; margin:0 0 6px }
  .muted { color:var(--muted) } .small { font-size:13px } .mono { font-family:var(--mono) } .right { text-align:right }
  .row { display:flex; align-items:center; gap:10px } .grow { flex:1; min-width:0 } .wrap { flex-wrap:wrap }
  .ellipsis { overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

  #offline { display:none; position:sticky; top:0; z-index:6; background:var(--amber); color:#fff; font-size:13px; font-weight:600; padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px; text-align:center }
  #offline.show { display:block } #offline.sync { background:var(--blue) }
  header.top { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px; display:flex; align-items:center; gap:10px }
  body.offline header.top { top:36px; padding-top:12px }
  header.top .back { width:40px; height:40px; border-radius:12px; border:0; background:var(--card); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none }
  header.top .act { height:40px; padding:0 14px; border-radius:12px; border:0; background:var(--accent); color:var(--accent-ink); font-weight:600; cursor:pointer; white-space:nowrap }
  main { padding:4px 16px 24px; max-width:720px; margin:0 auto }

  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px }
  .card.warn { border-color:var(--amber) }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; cursor:pointer }
  .stat .v { font-size:24px; font-weight:700; margin-top:2px } .stat .l { color:var(--muted); font-size:13px }
  .stat.accent { background:linear-gradient(135deg,#059669,#10b981); color:#fff; border:0 } .stat.accent .l { color:rgba(255,255,255,.85) }
  .stat.small .v { font-size:19px }

  .list .item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer }
  .list .item:last-child { border-bottom:0 } .list .item:active { opacity:.7 } .list .item.static { cursor:default }
  .chev { color:var(--muted); flex:none }

  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap }
  .b-active { background:rgba(16,185,129,.15); color:#059669 } .b-pending { background:rgba(37,99,235,.15); color:#2563eb }
  .b-expired { background:rgba(217,119,6,.15); color:#d97706 } .b-revoked { background:rgba(220,38,38,.15); color:#dc2626 }
  .b-expiring { background:rgba(217,119,6,.15); color:#d97706 } .b-off { background:var(--soft); color:var(--muted) } .b-stock { background:rgba(100,116,139,.18); color:var(--muted) }

  label.f { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=url], input[type=date], input[type=tel], select, textarea {
    width:100%; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text); font-size:16px }
  textarea { min-height:80px; resize:vertical }
  .check { display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer } .check input { width:20px; height:20px; accent-color:var(--accent) }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 16px; border-radius:12px; border:0; font-weight:600; cursor:pointer; background:var(--soft); color:var(--text); min-height:44px; text-decoration:none }
  .btn.primary { background:var(--accent); color:var(--accent-ink) } .btn.blue { background:var(--blue); color:#fff }
  .btn.danger { background:rgba(220,38,38,.12); color:var(--red) } .btn.block { width:100%; margin-top:10px } .btn.sm { padding:8px 12px; min-height:36px; font-size:14px }
  .btn.big { padding:16px; font-size:17px }
  .btn:disabled { opacity:.5; cursor:default }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px; scrollbar-width:none } .chips::-webkit-scrollbar { display:none } .chips.wrapc { flex-wrap:wrap; overflow:visible }
  .chip { flex:none; padding:8px 12px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:14px; cursor:pointer; white-space:nowrap; text-decoration:none; color:var(--text) }
  .chip.on { background:var(--text); color:var(--bg); border-color:var(--text) } .chip.big { padding:12px 16px; font-size:15px }

  .key { font-family:var(--mono); font-size:clamp(13px, 4.2vw, 18px); letter-spacing:.3px; background:#0f172a; color:#fff; padding:14px; border-radius:12px; text-align:center; word-break:break-all }
  .kv { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px } .kv:last-child { border-bottom:0 } .kv .k { color:var(--muted) }
  .bar { height:8px; background:var(--soft); border-radius:999px; overflow:hidden } .bar > i { display:block; height:100%; background:var(--accent) }
  .months { display:flex; align-items:flex-end; gap:6px; height:90px; margin-top:8px } .months .m { flex:1; text-align:center; font-size:10px; color:var(--muted) }
  .months .m i { display:block; background:var(--accent); border-radius:6px 6px 0 0; margin:0 auto 4px; width:70% }
  .empty { text-align:center; color:var(--muted); padding:28px 12px }
  .empty .big { font-size:40px; margin-bottom:8px }
  .offer-row { display:grid; grid-template-columns:1fr 70px 90px 36px; gap:6px; align-items:center; margin-bottom:8px }
  .offer-row input, .offer-row select { padding:10px 8px; font-size:15px }
  .offer-row .x { background:transparent; border:0; color:var(--red); font-size:20px; cursor:pointer; padding:0; height:40px }
  .dur { display:grid; grid-template-columns:1fr 1fr; gap:8px }
  .msgbox { white-space:pre-wrap; font-size:14px; background:var(--soft); border-radius:12px; padding:12px; line-height:1.5; word-break:break-word }
  table.t { width:100%; border-collapse:collapse; font-size:13px } table.t th, table.t td { padding:7px 4px; border-bottom:1px solid var(--line); text-align:right } table.t th:first-child, table.t td:first-child { text-align:left } table.t th { color:var(--muted); font-weight:500 }

  nav.bottom { position:fixed; left:0; right:0; bottom:0; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:var(--card); border-top:1px solid var(--line); display:flex; z-index:10 }
  nav.bottom a { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; color:var(--muted); font-size:11px; font-weight:500 }
  nav.bottom a.on { color:var(--accent) } nav.bottom svg { width:24px; height:24px }

  #toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 16px); transform:translateX(-50%); background:var(--text); color:var(--bg); padding:12px 18px; border-radius:12px; font-weight:500; opacity:0; transition:opacity .2s; z-index:50; max-width:90vw; text-align:center; pointer-events:none }
  #toast.show { opacity:1 } #toast.err { background:var(--red); color:#fff }

  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center }
  .sheet { background:var(--card); width:100%; max-width:720px; border-radius:20px 20px 0 0; padding:18px 16px calc(16px + var(--safe-b)); max-height:92vh; overflow:auto }
  .sheet h2 { margin-top:0 }

  .login { max-width:400px; margin:10vh auto 0; padding:0 20px; text-align:center }
  .login img { width:84px; height:84px; border-radius:22px; margin-bottom:14px }
  .login form { text-align:left; margin-top:20px }

  .spinner { width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:40px auto }
  @keyframes spin { to { transform:rotate(360deg) } }
  .steps li { margin:6px 0 } .steps { padding-left:20px }
  code { font-family:var(--mono); font-size:13px; background:var(--soft); padding:2px 6px; border-radius:6px; word-break:break-all }
  details summary { cursor:pointer; font-weight:600; padding:6px 0 }
</style>
</head>
<body>
<div id="offline"></div>
<div id="app"><div class="spinner"></div></div>
<div id="toast"></div>

<script>
/* ======================= État & stockage ======================= */
var STORE = 'licences_admin_servers_v1', CACHE_KEY = 'licences_admin_cache_v1', QUEUE_KEY = 'licences_admin_queue_v1';
var S = { servers: [], current: 0, deferredInstall: null, licFilter: { q: '', state: '', product: '' }, licPage: 1, offline: false, offlineSince: null, cache: {}, queue: [], syncing: false };
var $app = document.getElementById('app');

function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function loadServers() {
  var d = lsGet(STORE, null);
  if (d && Array.isArray(d.servers)) { S.servers = d.servers; S.current = d.current || 0; }
  if (!S.servers.length) S.servers = [{ name: 'Serveur principal', url: location.origin, token: null }];
  if (S.current >= S.servers.length) S.current = 0;
  S.cache = lsGet(CACHE_KEY, {}); S.queue = lsGet(QUEUE_KEY, []);
}
function saveServers() { lsSet(STORE, { servers: S.servers, current: S.current }); }
function saveCache() { var keys = Object.keys(S.cache); if (keys.length > 80) { keys.sort(function (a, b) { return S.cache[a].t - S.cache[b].t; }).slice(0, keys.length - 80).forEach(function (k) { delete S.cache[k]; }); } lsSet(CACHE_KEY, S.cache); }
function saveQueue() { lsSet(QUEUE_KEY, S.queue); updateOfflineBar(); }
function srv() { return S.servers[S.current]; }
function normalizeUrl(u) { u = String(u || '').trim().replace(/\/+$/, ''); if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u; return u; }

/* ======================= Appels API (avec cache hors ligne) ======================= */
async function api(path, opts, server) {
  opts = opts || {}; server = server || srv();
  var method = opts.method || 'GET';
  var headers = { 'Content-Type': 'application/json' };
  if (server.token) headers.Authorization = 'Bearer ' + server.token;
  var cacheKey = server.url + '|' + path;
  var res;
  try {
    res = await fetch(server.url + '/admin/api' + path, { method: method, headers: headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  } catch (e) {
    if (method === 'GET' && S.cache[cacheKey]) { setOffline(true, S.cache[cacheKey].t); return S.cache[cacheKey].data; }
    setOffline(true, null);
    var er = new Error(method === 'GET' ? 'Hors ligne : aucune donnée enregistrée pour cet écran.' : 'Hors ligne : cette action nécessite une connexion.'); er.offline = true; throw er;
  }
  var data = null; try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && !opts.noAuthRedirect) { server.token = null; saveServers(); setTimeout(route, 0); throw new Error((data && data.error) || 'Session expirée, reconnectez-vous'); }
  if (!res.ok) throw new Error((data && data.error) || ('Erreur ' + res.status));
  if (S.offline) { setOffline(false); flushQueue(); }
  if (method === 'GET' && !opts.noCache) { S.cache[cacheKey] = { t: Date.now(), data: data }; saveCache(); }
  return data;
}
function setOffline(on, since) {
  S.offline = on; if (on) S.offlineSince = since || S.offlineSince;
  document.body.classList.toggle('offline', on);
  updateOfflineBar();
}
function updateOfflineBar() {
  var bar = document.getElementById('offline');
  var n = S.queue.length;
  if (S.offline) { bar.className = 'show'; bar.textContent = 'Hors ligne' + (S.offlineSince ? ' · données du ' + fdt(new Date(S.offlineSince).toISOString()) : '') + (n ? ' · ' + plural(n, 'vente') + ' à synchroniser' : ''); }
  else if (n) { bar.className = 'show sync'; bar.textContent = S.syncing ? 'Synchronisation…' : plural(n, 'vente') + ' en attente de synchronisation'; }
  else bar.className = '';
}
/** Rejoue les actions faites hors ligne (ventes rapides depuis la réserve). */
async function flushQueue() {
  if (S.syncing || !S.queue.length) return;
  S.syncing = true; updateOfflineBar();
  var remaining = [];
  for (var i = 0; i < S.queue.length; i++) {
    var q = S.queue[i];
    var server = S.servers.find(function (s) { return s.url === q.server; });
    if (!server || !server.token) { remaining.push(q); continue; }
    try { await api(q.path, { method: q.method, body: q.body }, server); }
    catch (e) { if (e.offline) { remaining.push(q); } else if (!/introuvable|404/.test(e.message)) remaining.push(q); }
  }
  var done = S.queue.length - remaining.length;
  S.queue = remaining; S.syncing = false; saveQueue();
  if (done) { toast(plural(done, 'vente') + ' synchronisée' + (done > 1 ? 's' : '') + ' ✓'); if (!document.getElementById('sheet')) route(); }
}

/* ======================= Utilitaires ======================= */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function eur(c) { try { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format((c || 0) / 100); } catch (e) { return ((c || 0) / 100).toFixed(2) + ' €'; } }
function fdate(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return iso; } }
function fdt(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } }
function fmonth(ym) { try { var d = new Date(ym + '-01T12:00:00Z'); return d.toLocaleDateString('fr-FR', { month: 'short', year: '2-digit' }).replace('.', ''); } catch (e) { return ym; } }
function fdur(days) { if (!days || days <= 0) return 'à vie'; if (days % 365 === 0) return days / 365 === 1 ? '1 an' : (days / 365) + ' ans'; if (days % 30 === 0) return (days / 30) + ' mois'; if (days % 7 === 0) return days / 7 === 1 ? '1 semaine' : (days / 7) + ' semaines'; return days === 1 ? '1 jour' : days + ' jours'; }
function cap(s) { return String(s).replace(/^./, function (c) { return c.toUpperCase(); }); }
function toDays(n, unit) { n = Number(n) || 0; if (unit === 'vie') return 0; if (unit === 'ans') return n * 365; if (unit === 'mois') return n * 30; return n; }
function fromDays(days) { if (!days) return { n: 1, unit: 'vie' }; if (days % 365 === 0) return { n: days / 365, unit: 'ans' }; if (days % 30 === 0) return { n: days / 30, unit: 'mois' }; return { n: days, unit: 'jours' }; }
function plural(n, s, p) { return n + ' ' + (n > 1 ? (p || s + 's') : s); }
function parsePrice(v) { return Math.round(parseFloat(String(v || '0').replace(',', '.').replace(/[^\d.]/g, '')) * 100) || 0; }
var STATE_LABEL = { active: 'Active', pending: 'En attente', expired: 'Expirée', revoked: 'Désactivée', stock: 'Réserve' };
var PAY_LABELS_EXTRA = { trial: 'Essai gratuit' };
function badge(l) {
  var st = l.state, cls = 'b-' + st, txt = STATE_LABEL[st] || st;
  if (st === 'active' && l.days_left !== null && l.days_left <= 7) { cls = 'b-expiring'; txt = 'Expire dans ' + plural(l.days_left, 'jour'); }
  if (l.trial) txt = 'Essai · ' + txt;
  return '<span class="badge ' + cls + '">' + esc(txt) + '</span>';
}
function expiryText(l) {
  if (l.state === 'revoked') return 'Désactivée';
  if (l.state === 'pending' || l.state === 'stock') return l.lifetime ? 'À vie · pas encore activée' : fdur(l.duration_days) + ' · pas encore activée';
  if (l.lifetime || !l.expires_at) return 'À vie';
  if (l.state === 'expired') return 'Expirée le ' + fdate(l.expires_at);
  return 'Jusqu\'au ' + fdate(l.expires_at) + ' (' + plural(l.days_left, 'jour') + ')';
}
var EVENT_LABEL = { sale: 'Vente PayPal', trial_started: 'Essai gratuit démarré', order_created: 'Commande reçue', order_paid: 'Paiement validé', order_cancelled: 'Commande annulée', stripe_error: 'Erreur Stripe', sold: 'Vente rapide', license_created: 'Licence créée', stock_created: 'Clés en réserve', activate: 'Activation', device_added: 'Nouvel appareil', device_removed: 'Appareil retiré', devices_reset: 'Appareils réinitialisés', revoke: 'Désactivation', reactivate: 'Réactivation', refund: 'Remboursement', extend: 'Prolongation', set_expiry: 'Date modifiée', email_sent: 'Email envoyé', email_failed: 'Échec email', paypal_error: 'Erreur PayPal', webhook_error: 'Erreur webhook', webhook_rejected: 'Webhook refusé', webhook_ignored: 'Webhook ignoré', recover_sent: 'Clés renvoyées', recover_failed: 'Échec renvoi clés', settings: 'Réglages modifiés', product_created: 'Application créée', product_update: 'Nouvelle version publiée' };
var ERROR_EVENTS = ['email_failed', 'paypal_error', 'stripe_error', 'webhook_error', 'webhook_rejected', 'webhook_ignored', 'recover_failed'];
var PAY_LABELS = { trial: 'Essai gratuit', cash: 'Espèces', virement: 'Virement', lydia: 'Lydia', wero: 'Wero', paypalme: 'PayPal', paypal: 'PayPal', stripe: 'Carte (Stripe)', revolut: 'Revolut', autre: 'Autre', '': 'Non précisé' };
function payLabel(m) { return PAY_LABELS[m] || m || 'Non précisé'; }
var QUICK_METHODS = [['cash', 'Espèces'], ['virement', 'Virement'], ['lydia', 'Lydia'], ['wero', 'Wero'], ['paypalme', 'PayPal'], ['revolut', 'Revolut'], ['autre', 'Autre']];

var toastTimer;
function toast(msg, isErr) { var t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, isErr ? 4500 : 2500); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || 'Copié') + ' ✓'); }
  catch (e) { prompt('Copiez :', text); }
}
async function share(title, text, url) {
  if (navigator.share) { try { await navigator.share(url ? { title: title, text: text, url: url } : { title: title, text: text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copy(url ? text + ' ' + url : text, 'Copié (partage non disponible ici)');
}
function sheet(html) {
  closeSheet();
  var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = '<div class="sheet">' + html + '</div>';
  bg.addEventListener('click', function (e) { if (e.target === bg) closeSheet(); });
  document.body.appendChild(bg);
  return bg;
}
function closeSheet() { var s = document.getElementById('sheet'); if (s) s.remove(); }
function confirmSheet(title, text, okLabel, danger) {
  return new Promise(function (resolve) {
    sheet('<h2>' + esc(title) + '</h2><p class="muted">' + esc(text) + '</p><div class="actions"><button class="btn grow" id="c-no">Annuler</button><button class="btn grow ' + (danger ? 'danger' : 'primary') + '" id="c-ok">' + esc(okLabel || 'Confirmer') + '</button></div>');
    document.getElementById('c-no').onclick = function () { closeSheet(); resolve(false); };
    document.getElementById('c-ok').onclick = function () { closeSheet(); resolve(true); };
  });
}
function promptSheet(title, label, value, type, okLabel) {
  return new Promise(function (resolve) {
    sheet('<h2>' + esc(title) + '</h2><label class="f">' + esc(label) + '</label><input id="p-in" type="' + (type || 'text') + '" value="' + esc(value || '') + '"><div class="actions"><button class="btn grow" id="p-no">Annuler</button><button class="btn grow primary" id="p-ok">' + esc(okLabel || 'Valider') + '</button></div>');
    var inp = document.getElementById('p-in'); setTimeout(function () { inp.focus(); }, 50);
    document.getElementById('p-no').onclick = function () { closeSheet(); resolve(null); };
    document.getElementById('p-ok').onclick = function () { var v = inp.value; closeSheet(); resolve(v); };
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('p-ok').click(); });
  });
}
/** Message prêt à envoyer au client (SMS, WhatsApp, email). */
function clientMessage(l, downloadUrl) {
  return 'Votre accès à ' + l.product_name + '\n' +
    'Code : ' + l.key + '\n' +

function route() {

  if (!v) return viewHome();
  if (v === 'apps') return id === 'new' ? viewAppForm(null) : id ? viewAppForm(Number(id)) : viewApps();
  if (v === 'licences') return id === 'new' ? viewNewLicence(parts[2] ? { customer: Number(parts[2]) } : null) : id ? viewLicence(Number(id)) : viewLicences();
  if (v === 'clients') return id ? viewClient(Number(id)) : viewClients();
  if (v === 'plus') return viewMore();
  if (v === 'serveurs') return viewServers();
  if (v === 'reglages') return viewSettings();
  if (v === 'journal') return viewJournal();
  if (v === 'guide') return viewGuide();
  if (v === 'finances') return viewFinances();
  if (v === 'reserve') return viewStock();

}

function buildMonths(rows) {
  var out = [], now = new Date();
  for (var i = 5; i >= 0; i--) {

    out.push({ label: dt.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', ''), revenue: found ? found.revenue : 0 });
  }
  return out;
}

/* ======================= Vente rapide ======================= */
async function quickSale(presetProductId) {
  var products, stock;
  try { products = (await api('/products')).products.filter(function (p) { return p.active; }); } catch (e) { return toast(e.message, true); }
  try { stock = (await api('/stock')).stock; } catch (e) { stock = []; }
  if (!products.length) return sheet('<h2>Aucune application</h2><p class="muted">Créez d\'abord une application (onglet Apps).</p><button class="btn primary block" data-act="close-go" data-to="/apps/new">Créer une application</button>');
  var state = { product: products.find(function (p) { return p.id === presetProductId; }) || products[0], days: null, price: null, custom: false, method: 'cash' };
  function offersOf(p) { return (p.offers || []).filter(function (o) { return o.active; }); }
  function stockFor(pid, days) { return stock.filter(function (s) { return s.product_id === pid && s.duration_days === days; }); }
  function draw() {
    var p = state.product, offers = offersOf(p);
    if (state.days === null && offers.length) { state.days = offers[0].days; state.price = offers[0].price_cents; }
    if (!offers.length) state.custom = true;
    var h = '<h2>⚡ Vente rapide</h2>';
    if (products.length > 1) h += '<div class="chips wrapc">' + products.map(function (x) { return '<span class="chip big ' + (x.id === p.id ? 'on' : '') + '" data-qs="product" data-id="' + x.id + '">' + esc(x.name) + '</span>'; }).join('') + '</div>';
    else h += '<p class="muted" style="margin:0 0 8px">' + esc(p.name) + '</p>';
    h += '<label class="f">Durée et prix</label><div class="chips wrapc">' + offers.map(function (o) {
      var st = S.offline ? stockFor(p.id, o.days).length : null;
      return '<span class="chip big ' + (!state.custom && state.days === o.days ? 'on' : '') + '" data-qs="offer" data-days="' + o.days + '" data-price="' + o.price_cents + '">' + esc(o.label) + ' · ' + eur(o.price_cents) + (st !== null ? ' <small>(' + st + ' en réserve)</small>' : '') + '</span>';
    }).join('') + '<span class="chip big ' + (state.custom ? 'on' : '') + '" data-qs="custom">Autre…</span></div>';
    if (state.custom) h += '<div class="dur"><input type="number" id="qs-n" min="1" value="1"><select id="qs-unit"><option value="jours">jours</option><option value="mois">mois</option><option value="ans" selected>ans</option><option value="vie">à vie</option></select></div>';
    h += '<label class="f">Prix encaissé (€)</label><input type="number" id="qs-price" step="0.01" min="0" value="' + (state.price !== null ? (state.price / 100).toFixed(2) : '') + '" placeholder="0,00">' +
      '<label class="f">Payé par</label><div class="chips wrapc">' + QUICK_METHODS.map(function (m) { return '<span class="chip ' + (state.method === m[0] ? 'on' : '') + '" data-qs="method" data-id="' + m[0] + '">' + m[1] + '</span>'; }).join('') + '</div>' +
      '<label class="f">Email du client (facultatif, pour lui envoyer la clé et le retrouver)</label><input type="email" id="qs-email" placeholder="client@exemple.fr">' +
      (S.offline ? '<p class="small" style="color:var(--amber)">Hors ligne : la clé sera prise dans votre réserve et la vente synchronisée dès le retour du réseau.</p>' : '') +
      '<button class="btn primary big block" id="qs-go">Générer la clé</button>';
    var box = document.querySelector('#sheet .sheet'); if (box) box.innerHTML = h; else sheet(h);
    document.querySelectorAll('[data-qs]').forEach(function (el) {
      el.onclick = function () {
        var k = el.dataset.qs;
        if (k === 'product') { state.product = products.find(function (x) { return x.id === Number(el.dataset.id); }); state.days = null; state.custom = false; }
        else if (k === 'offer') { state.days = Number(el.dataset.days); state.price = Number(el.dataset.price); state.custom = false; }
        else if (k === 'custom') { state.custom = true; state.price = parsePrice(document.getElementById('qs-price').value) || null; }
        else if (k === 'method') { state.method = el.dataset.id; state.price = parsePrice(document.getElementById('qs-price').value) || null; }
        draw();
      };
    });
    document.getElementById('qs-go').onclick = submit;
  }
  async function submit() {
    var p = state.product, days = state.custom ? toDays(document.getElementById('qs-n').value, document.getElementById('qs-unit').value) : state.days;
    if (days === null || isNaN(days)) return toast('Choisissez une durée', true);
    var price = parsePrice(document.getElementById('qs-price').value), email = document.getElementById('qs-email').value.trim();
    var btn = document.getElementById('qs-go'); btn.disabled = true; btn.textContent = 'Création…';
    var lic = null;
    if (!S.offline) {
      try {
        var r = await api('/licenses', { method: 'POST', body: { product_id: p.id, days: days, price_cents: price, email: email || undefined, send_email: !!email, note: 'Vente rapide', offer_label: cap(fdur(days)), payment_method: state.method } });
        lic = r.license; lic._emailSent = r.email_sent;
      } catch (e) { if (!e.offline) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Générer la clé'; return; } }
    }
    if (!lic) {
      var avail = stockFor(p.id, days);
      if (!avail.length) { toast('Pas de clé en réserve pour « ' + p.name + ' · ' + fdur(days) + ' ». Préparez des clés (Plus → Réserve) quand vous avez du réseau.', true); btn.disabled = false; btn.textContent = 'Générer la clé'; return; }
      var s0 = avail[0];
      lic = { id: s0.id, key: s0.key, product_name: s0.product_name, duration_days: s0.duration_days, lifetime: s0.duration_days === 0, max_devices: s0.max_devices, price_cents: price, customer_email: email, _offline: true };
      S.queue.push({ server: srv().url, path: '/licenses/' + s0.id + '/mark_sold', method: 'POST', body: { price_cents: price, email: email || undefined, send_email: !!email, note: 'Vente rapide (hors ligne)', sold_at: new Date().toISOString(), payment_method: state.method }, at: Date.now() });
      saveQueue();
      stock = stock.filter(function (s) { return s.id !== s0.id; });
      var ck = srv().url + '|/stock'; if (S.cache[ck]) { S.cache[ck].data = { stock: stock }; saveCache(); }
    }
    showSaleResult(lic, p.download_url);
  }
  draw();
}

document.addEventListener('click', async function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.dataset.act;
  if (el.tagName === 'A') e.preventDefault();
  switch (act) {
    case 'back': history.length > 1 ? history.back() : go('/'); break;
    case 'go': go(el.dataset.to); break;
    case 'close-go': closeSheet(); go(el.dataset.to); break;
    case 'close': closeSheet(); break;
    case 'reload': route(); break;
    case 'copy': copy(el.dataset.text); break;
    case 'share-link': share(el.dataset.name, 'Acheter ' + el.dataset.name + ' : ', el.dataset.link); break;
    case 'share-text': share(el.dataset.title || 'Accès', el.dataset.text); break;
    case 'quick-sale': quickSale(el.dataset.id ? Number(el.dataset.id) : undefined); break;
    case 'export-csv': exportCsv(); break;
    case 'receipt': {
      try {
        var r = await api('/licenses/' + el.dataset.id + '/receipt-link', { method: 'POST', body: {} });
        sheet('<h2>🧾 Reçu</h2><p class="muted small">Ce lien ouvre le reçu (imprimable / PDF). Vous pouvez l\'envoyer au client.</p><div class="key" style="font-size:12px">' + esc(r.url) + '</div><div class="actions"><a class="btn grow primary" href="' + esc(r.url) + '" target="_blank" rel="noopener">Ouvrir</a><button class="btn grow blue" data-act="share-text" data-title="Reçu" data-text="Votre reçu : ' + esc(r.url) + '">Envoyer au client</button><button class="btn grow" data-act="copy" data-text="' + esc(r.url) + '">Copier</button></div>');
      } catch (err) { toast(err.message, true); }
      break;
    }
    case 'pick-server': {
      sheet('<h2>Choisir un serveur</h2><div class="list">' + S.servers.map(function (s, i) { return '<div class="item" data-act="switch-server" data-i="' + i + '"><div class="grow"><b>' + esc(s.name) + '</b><div class="muted small">' + esc(s.url) + '</div></div>' + I.chev + '</div>'; }).join('') + '</div>');
      break;
    }
    case 'switch-server': S.current = Number(el.dataset.i); saveServers(); closeSheet(); go('/'); route(); break;
    case 'rm-server': {
      if (await confirmSheet('Retirer ce serveur de la liste ?', 'Le serveur lui-même n\'est pas supprimé ; vous pourrez le rajouter avec son adresse et le mot de passe.', 'Retirer', true)) {
        var i = Number(el.dataset.i); S.servers.splice(i, 1); if (S.current >= S.servers.length) S.current = 0; else if (i < S.current) S.current--; saveServers(); viewServers();
      }
      break;
    }
    case 'rename-server': { var n = await promptSheet('Nom du serveur', 'Nom', srv().name); if (n) { srv().name = n.trim(); saveServers(); viewServers(); } break; }
    case 'logout': { if (await confirmSheet('Se déconnecter ?', 'Vous devrez saisir à nouveau le mot de passe administrateur.', 'Se déconnecter')) { srv().token = null; saveServers(); route(); } break; }
    case 'install': { if (S.deferredInstall) { S.deferredInstall.prompt(); S.deferredInstall = null; } break; }
    case 'add-offer': document.getElementById('offers').insertAdjacentHTML('beforeend', offerRowHtml(null)); break;
    case 'rm-offer': el.closest('.offer-row').remove(); break;
    case 'del-product': {
      if (await confirmSheet('Supprimer l\'application ?', 'Possible uniquement si aucune licence n\'a été vendue.', 'Supprimer', true)) {
        try { await api('/products/' + el.dataset.id, { method: 'DELETE' }); toast('Supprimée'); go('/apps'); } catch (err) { toast(err.message, true); }
      }
      break;
    }
    case 'order-paid': {
      var amt = await promptSheet('Paiement reçu ?', 'Montant reçu (€) — modifiez si différent', (Number(el.dataset.amount) / 100).toFixed(2), 'number', 'Payé, envoyer la clé');
      if (amt === null) break;
      try {
        var ro = await api('/orders/' + el.dataset.id + '/paid', { method: 'POST', body: { amount_cents: parsePrice(amt) } });
        var lo = ro.license; lo._emailSent = ro.email_sent;
        var prods = (await api('/products')).products, pr0 = prods.find(function (x) { return x.id === lo.product_id; });
        viewOrders();
        showSaleResult(lo, pr0 ? pr0.download_url : '');
      } catch (err) { toast(err.message, true); }
      break;
    }
    case 'order-cancel': {
      if (await confirmSheet('Annuler cette commande ?', 'Le client ne recevra pas de clé. Vous pourrez la rouvrir depuis l\'historique.', 'Annuler la commande', true)) {
        try { await api('/orders/' + el.dataset.id + '/cancel', { method: 'POST', body: {} }); toast('Commande annulée'); viewOrders(); } catch (err) { toast(err.message, true); }
      }
      break;
    }
    case 'order-reopen': { try { await api('/orders/' + el.dataset.id + '/reopen', { method: 'POST', body: {} }); toast('Commande rouverte'); go('/commandes'); viewOrders(); } catch (err) { toast(err.message, true); } break; }
    case 'del-stock': {
      try { await api('/licenses/' + el.dataset.id + '/delete', { method: 'POST', body: {} }); toast('Clé retirée de la réserve'); viewStock(); } catch (err) { toast(err.message, true); }
      break;
    }
    case 'lic-state': S.licFilter.state = el.dataset.v; S.licPage = 1; document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c === el); }); loadLicList(false); break;
    case 'lic-more': S.licPage++; el.disabled = true; loadLicList(true); break;
    case 'extend': {
      var id = Number(el.dataset.id), days = el.dataset.days ? Number(el.dataset.days) : null;
      if (!days) { var v = await promptSheet('Prolonger', 'Nombre de jours (négatif pour réduire)', '30', 'number', 'Prolonger'); if (v === null || !Number(v)) break; days = Number(v); }
      licAction(id, 'extend', { days: days }); break;
    }
    case 'rm-device': {
      if (await confirmSheet('Retirer cet appareil ?', 'Le client pourra activer la licence sur un autre appareil.', 'Retirer')) {
        try { await api('/licenses/' + el.dataset.lic + '/devices/' + el.dataset.id, { method: 'DELETE' }); toast('Appareil retiré'); viewLicence(Number(el.dataset.lic)); } catch (err) { toast(err.message, true); }
      }
      break;
    }
    case 'lic': {
      var lid = Number(el.dataset.id), a = el.dataset.a;
      if (a === 'revoke') { if (await confirmSheet('Désactiver la licence ?', 'L\'application du client se bloquera sous 7 jours maximum. Vous pourrez la réactiver.', 'Désactiver', true)) licAction(lid, 'revoke'); }
      else if (a === 'reactivate') licAction(lid, 'reactivate');
      else if (a === 'reset_devices') { if (await confirmSheet('Réinitialiser les appareils ?', 'Tous les appareils seront retirés ; le client réactivera simplement sa clé.', 'Réinitialiser')) licAction(lid, 'reset_devices'); }
      else if (a === 'set_max_devices') { var m = await promptSheet('Appareils autorisés', 'Nombre d\'appareils', '2', 'number'); if (m) licAction(lid, 'set_max_devices', { max_devices: Number(m) }); }
      else if (a === 'set_expiry') { var dte = await promptSheet('Date de fin', 'La licence expirera à cette date', new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10), 'date'); if (dte) licAction(lid, 'set_expiry', { expires_at: dte + 'T23:59:59.000Z' }); }
      else if (a === 'lifetime') { if (await confirmSheet('Passer la licence à vie ?', 'Elle n\'expirera plus jamais.', 'Passer à vie')) licAction(lid, 'set_expiry', { expires_at: null }); }
      else if (a === 'set_customer') { var em2 = await promptSheet('Client', 'Email du client (vide pour retirer)', '', 'email'); if (em2 !== null) licAction(lid, 'set_customer', { email: em2.trim() }); }
      else if (a === 'set_payment_method') {
        sheet('<h2>Payé par</h2><div class="chips wrapc">' + QUICK_METHODS.map(function (m) { return '<span class="chip big" data-act="lic-method" data-id="' + lid + '" data-m="' + m[0] + '">' + m[1] + '</span>'; }).join('') + '</div>');
      }
      else if (a === 'set_price') { var pr = await promptSheet('Prix payé', 'Montant en € (pour vos statistiques et le reçu)', el.dataset.price || '', 'number'); if (pr !== null) licAction(lid, 'set_price', { price_cents: parsePrice(pr) }); }
      else if (a === 'resend_email') { var to = await promptSheet('Envoyer la clé par email', 'Adresse email', el.dataset.email || '', 'email', 'Envoyer'); if (to) licAction(lid, 'resend_email', { email: to.trim() }); }
      else if (a === 'note') { var nt = await promptSheet('Note', 'Note interne', el.dataset.note || ''); if (nt !== null) licAction(lid, 'note', { note: nt }); }
      else if (a === 'delete') { if (await confirmSheet('Supprimer définitivement ?', 'La clé ne fonctionnera plus et disparaîtra des statistiques. Préférez « Désactiver » si vous hésitez.', 'Supprimer', true)) { try { await api('/licenses/' + lid + '/delete', { method: 'POST', body: {} }); toast('Supprimée'); go('/licences'); } catch (err) { toast(err.message, true); } } }
      break;
    }
    case 'lic-method': closeSheet(); licAction(Number(el.dataset.id), 'set_payment_method', { payment_method: el.dataset.m }); break;
    case 'edit-client': {
      sheet('<h2>Modifier le client</h2><label class="f">Email</label><input id="c-email" type="email" value="' + esc(el.dataset.email) + '"><label class="f">Nom</label><input id="c-name" type="text" value="' + esc(el.dataset.name) + '"><div class="actions"><button class="btn grow" data-act="close">Annuler</button><button class="btn grow primary" id="c-save">Enregistrer</button></div>');
      document.getElementById('c-save').onclick = async function () {
        try { await api('/customers/' + el.dataset.id, { method: 'PUT', body: { email: document.getElementById('c-email').value.trim(), name: document.getElementById('c-name').value.trim() } }); closeSheet(); toast('Enregistré ✓'); viewClient(Number(el.dataset.id)); } catch (err) { toast(err.message, true); }
      };
      break;
    }
    case 'test-email': { var te = await promptSheet('Email de test', 'Envoyer à', '', 'email', 'Envoyer'); if (te) { try { await api('/test-email', { method: 'POST', body: { to: te.trim() } }); toast('Email de test envoyé ✓'); } catch (err) { toast(err.message, true); } } break; }
  }
});

/* ======================= Démarrage ======================= */
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.deferredInstall = e; });
window.addEventListener('online', function () { if (srv().token) { api('/me', { noCache: true }).catch(function () {}); } });
if ('serviceWorker' in navigator && window.isSecureContext) { navigator.serviceWorker.register('/sw.js', { scope: '/admin' }).catch(function () {}); }
loadServers();
updateOfflineBar();
route();
if (S.queue.length && srv().token) flushQueue();
</script>
